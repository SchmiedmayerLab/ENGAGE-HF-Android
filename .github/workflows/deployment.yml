name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: |
          The Google Play track to publish to, and the environment holding its credentials.
        required: true
        default: 'internal'
        type: choice
        options:
          - production
          - internal
      version:
        description: |
          The semantic version of the app that should be released.
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: |
          The Google Play track to publish to, and the environment holding its credentials.
        required: false
        type: string
        default: internal
      version:
        description: |
          The semantic version of the app that should be released.
        required: true
        type: string

concurrency:
  group: main
  cancel-in-progress: false

jobs:
  android:
    name: Android
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    secrets: inherit

  google_play:
    name: Upload App to Google Play
    needs: android
    uses: SchmiedmayerLab/.github/.github/workflows/android-google-play.yml@v0.5
    permissions:
      contents: write
    secrets: inherit
    with:
      environment: ${{ inputs.environment || 'internal' }}
      recordversion: true
      version: ${{ inputs.version }}
      keystorepaths: |
        keystore.jks
        app/keystore.jks
      googleservicespath: app/google-services.json
      secretsxmlpath: engagehf-modules/account/src/main/res/values/secrets.xml
