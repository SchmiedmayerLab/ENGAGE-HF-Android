name: Pull Request

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildtestandanalyze:
    uses: ./.github/workflows/build-test-analyze.yml
    permissions:
      actions: read
      contents: write
      packages: read
      security-events: write
    secrets: inherit
